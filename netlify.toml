# Netlify build and hosting configuration.
# The site is a static export (see next.config.js): `next build` writes it to
# `out/`, and Netlify serves those files from its CDN. No functions run.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Security headers for every response. The Content-Security-Policy is set per
# page via <meta> instead (see lib/csp.ts for why).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The admin is never cached, so a CMS config change takes effect immediately.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# Old Supabase admin URLs now point to the Decap CMS admin.
[[redirects]]
  from = "/admin/login"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/admin/dashboard/*"
  to = "/admin/"
  status = 301
